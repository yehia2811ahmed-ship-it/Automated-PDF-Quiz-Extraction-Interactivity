    function render() {
        if(idx >= data.length) {
            showFinalResult();
            return;
        }
        const item = data[idx];
        document.getElementById('q-text').innerText = item.num + "- " + item.q;
        document.getElementById('ans-hint').innerText = "Correct Answer: " + String.fromCharCode(97 + item.ans) + ") " + item.opts[item.ans];
        document.getElementById('ans-hint').style.display = "none";

        const area = document.getElementById('options-area');
        area.innerHTML = "";
        item.opts.forEach((o, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn' + (userSels[idx] === i ? ' selected' : '');
            b.innerText = String.fromCharCode(97+i) + "- " + o;
            b.onclick = () => { userSels[idx] = i; render(); };
            area.appendChild(b);
        });
        document.getElementById('next-text').innerText = (idx === data.length - 1) ? "إنهاء الاختبار" : "التالي";
    }

    function toggleAns() {
        const hint = document.getElementById('ans-hint');
        hint.style.display = (hint.style.display === "none") ? "block" : "none";
    }

    function move(n) {
        if (n === 1 && idx === data.length - 1) { showFinalResult(); return; }
        idx = Math.max(0, Math.min(data.length - 1, idx + n));
        render();
    }

    function showFinalResult() {
        let score = 0;
        data.forEach((item, i) => { if(userSels[i] === item.ans) score++; });
        document.getElementById('quiz-body').innerHTML = `
            <div class="result-screen">
